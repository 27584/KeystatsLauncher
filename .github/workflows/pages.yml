name: Deploy Pages
on:
  push:
    branches: [ main ]

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

permissions:
  contents: write # JamesIves只需要这个，删掉pages、id‑token那两行！

jobs:
  deploy:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy web folder
        uses: JamesIves/github‑pages‑deploy‑action@v4
        with:
          folder: web
          branch: gh‑pages
