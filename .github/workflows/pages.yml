name: Deploy site
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu‑latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload artifact
        uses: actions/upload‑pages‑artifact@v3
        with:
          path: ./web 
      - name: Deploy
        uses: actions/deploy‑pages@v4
